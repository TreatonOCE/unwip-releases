# When a new package lands in packages/, publish it as a GitHub Release too.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['latest.json']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r .tag_name latest.json)
          VER=${TAG#v}
          if gh release view "$TAG" >/dev/null 2>&1; then echo "already released"; exit 0; fi
          # a test (Unwip Dev) package must never become a public release: older copies of Unwip would install it
          if unzip -p "packages/unwip-app-$VER.zip" package.json | jq -e '.flavor == "dev"' >/dev/null; then echo "::error::refusing to publish a Dev package"; exit 1; fi
          jq -r .body latest.json > notes.md
          gh release create "$TAG" "packages/unwip-app-$VER.zip" "packages/unwip-app-$VER.zip.sha256" --title "Unwip $VER" --notes-file notes.md
